<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="婴儿车选购评分与多产品对比工具：100 分评分体系，本地运行，无需后端。">
<title>婴儿车选购评分器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="container header-inner">
    <div class="brand">
      <h1 class="brand-title">婴儿车选购评分器</h1>
      <p class="brand-sub">用 100 分评分体系，对比多款婴儿车</p>
    </div>
    <div class="header-actions">
      <button type="button" id="btnAdd" class="btn btn-primary">+ 添加产品</button>
      <button type="button" id="btnImport" class="btn">导入</button>
      <button type="button" id="btnExport" class="btn">导出</button>
      <button type="button" id="btnClear" class="btn btn-ghost-danger">清空</button>
      <input type="file" id="fileInput" accept="application/json,.json" class="visually-hidden" aria-hidden="true" tabindex="-1">
    </div>
  </div>
</header>

<main class="container app-main">

  <section class="panel" id="section-ranking" aria-labelledby="h-ranking">
    <div class="panel-head">
      <h2 class="panel-title" id="h-ranking">综合排名</h2>
      <div class="panel-tools">
        <label class="inline-label" for="sortSelect">排序依据</label>
        <select id="sortSelect" class="select select-sm"></select>
      </div>
    </div>
    <div class="panel-body" id="rankingBody"></div>
  </section>

  <section class="panel" id="section-prefs" aria-labelledby="h-prefs">
    <div class="panel-head">
      <h2 class="panel-title" id="h-prefs">我的使用场景</h2>
      <p class="panel-hint">场景偏好不会改变产品的客观 100 分，只用于计算「与你的使用场景匹配度」。</p>
    </div>
    <div class="panel-body">
      <div class="scenario-grid" id="scenarioGrid"></div>
    </div>
  </section>

  <section class="panel" id="section-products" aria-labelledby="h-products">
    <div class="panel-head">
      <h2 class="panel-title" id="h-products">产品列表<span class="count-badge" id="productCount"></span></h2>
      <div class="panel-tools">
        <button type="button" id="btnAdd2" class="btn btn-primary btn-sm">+ 添加产品</button>
      </div>
    </div>
    <div class="panel-body">
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <section class="panel" id="section-warnings" aria-labelledby="h-warnings">
    <div class="panel-head">
      <h2 class="panel-title" id="h-warnings">风险提醒</h2>
    </div>
    <div class="panel-body" id="warningsBody"></div>
  </section>

  <section class="panel" id="section-compare" aria-labelledby="h-compare">
    <div class="panel-head">
      <h2 class="panel-title" id="h-compare">产品横向对比</h2>
      <p class="panel-hint">每一行中，<span class="legend-chip is-best">绿色</span>为最优，<span class="legend-chip is-worst">橙红色</span>为最弱；并列时同时高亮。</p>
    </div>
    <div class="panel-body" id="compareBody"></div>
  </section>

  <section class="panel" id="section-pk" aria-labelledby="h-pk">
    <div class="panel-head">
      <h2 class="panel-title" id="h-pk">PK 对比</h2>
    </div>
    <div class="panel-body" id="pkBody"></div>
  </section>

  <section class="panel" id="section-rules" aria-labelledby="h-rules">
    <div class="panel-head">
      <h2 class="panel-title" id="h-rules">评分规则说明</h2>
      <p class="panel-hint">总分严格等于 <strong id="rulesTotal">100</strong> 分，共 <strong id="rulesCount">13</strong> 个评分项目。</p>
    </div>
    <div class="panel-body" id="rulesBody"></div>
  </section>

  <footer class="app-footer">
    <p>数据保存在本机浏览器 localStorage 中，不会上传。评分结果仅供选购参考，请以产品官方说明书与实际体验为准。</p>
  </footer>
</main>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
